<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | Sgv.artes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #FDF5E6; /* Fundo Bege */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #DEB887;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .login-card h2 {
            color: #8B4513; /* Marrom Dark */
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #A0522D;
            font-size: 0.9em;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: #5D4037;
            font-size: 0.85em;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline-color: #DEB887;
        }
        .btn-login {
            background-color: #8B4513;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            font-size: 1em;
        }
        .btn-login:hover {
            background-color: #5D4037;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 0.85em;
            color: #8B4513;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        /* Alerta de erro caso a senha esteja errada */
        .flash-error {
            color: #d9534f;
            background: #f2dede;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Sgv.artes</h2>
    <p class="subtitle">Painel de Gestão de Estoque</p>
    
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label>Usuário:</label>
            <input type="text" name="username" placeholder="Digite seu usuário" required>
        </div>
        
        <div class="form-group">
            <label>Senha:</label>
            <input type="password" name="password" placeholder="Digite sua senha" required>
        </div>
        
        <button type="submit" class="btn-login">Entrar no Sistema</button>
    </form>

    <a href="{{ url_for('index') }}" class="back-link">← Voltar para a Loja</a>
</div>

</body>
</html>
